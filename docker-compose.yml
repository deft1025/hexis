services:
  mysql:
    image: mysql:8.0
    container_name: hexis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_in_prod}
      MYSQL_DATABASE: ${DB_NAME:-hexis}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"  # 仅本地可访问
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-change_me_in_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: hexis-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_prod}
      DB_NAME: ${DB_NAME:-hexis}
      HTTP_ADDR: ":8182"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8182:8182"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
